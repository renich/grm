<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Glass Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="1.0"/>
    </radialGradient>

    <!-- Crystal Shard Facet Gradients (Crystal Flaw Shard Style) -->
    <linearGradient id="facetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="facetTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="facetCenterLeft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="facetCenterRight" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="facetBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="facetBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="shardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#6366F1" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Base Square Container with Rounded Corners -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" stroke="#312E81" stroke-width="3"/>

  <!-- Background Subtle Geometry Grid -->
  <g stroke="#312E81" stroke-width="1.5" opacity="0.3">
    <circle cx="256" cy="220" r="160" fill="none"/>
    <circle cx="256" cy="220" r="110" fill="none"/>
    <line x1="256" y1="40" x2="256" y2="400"/>
    <line x1="76" y1="220" x2="436" y2="220"/>
  </g>

  <!-- Centered Crystal Shard Emblem -->
  <g transform="translate(256, 210)" filter="url(#shardGlow)">
    <!-- Top Apex (0, -135), Right (-95, -35), Mid Right (75, 60), Bottom Apex (0, 135), Mid Left (-75, 60), Left (-95, -35) -->

    <!-- Facet 1: Top Left -->
    <polygon points="0,-135 -95,-35 0,0" fill="url(#facetTopLeft)" opacity="0.95"/>

    <!-- Facet 2: Top Right -->
    <polygon points="0,-135 95,-35 0,0" fill="url(#facetTopRight)" opacity="0.90"/>

    <!-- Facet 3: Mid-Left Shard -->
    <polygon points="-95,-35 -75,60 0,0" fill="url(#facetCenterLeft)" opacity="0.98"/>

    <!-- Facet 4: Mid-Right Shard -->
    <polygon points="95,-35 75,60 0,0" fill="url(#facetCenterRight)" opacity="0.92"/>

    <!-- Facet 5: Bottom Left Apex Shard -->
    <polygon points="-75,60 0,135 0,0" fill="url(#facetBottomLeft)" opacity="0.90"/>

    <!-- Facet 6: Bottom Right Apex Shard -->
    <polygon points="75,60 0,135 0,0" fill="url(#facetBottomRight)" opacity="0.95"/>

    <!-- Edge Highlights -->
    <g stroke="#F0F9FF" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-135" x2="0" y2="135"/>
      <line x1="-95" y1="-35" x2="95" y2="-35"/>
      <line x1="-95" y1="-35" x2="0" y2="0"/>
      <line x1="95" y1="-35" x2="0" y2="0"/>
      <line x1="-75" y1="60" x2="0" y2="0"/>
      <line x1="75" y1="60" x2="0" y2="0"/>
    </g>

    <!-- Outer Polygon Rim -->
    <polygon points="0,-135 95,-35 75,60 0,135 -75,60 -95,-35" fill="none" stroke="#A5B4FC" stroke-width="3" opacity="0.95"/>

    <!-- Embedded Telegram Vector -->
    <g transform="translate(-4, -4) scale(1.6)">
      <path d="M-18,-8 L22,-18 L-6,18 L-6,4 Z" fill="url(#planeGrad)" opacity="0.95"/>
      <path d="M-6,4 L6,-2 L-6,18 Z" fill="#93C5FD" opacity="0.90"/>
    </g>
  </g>

  <!-- Logotype at Bottom -->
  <g transform="translate(256, 435)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="56" letter-spacing="4" fill="url(#textGrad)" text-anchor="middle">grm</text>
  </g>
</svg>
