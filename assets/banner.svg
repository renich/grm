<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Glass Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#151b30" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Crystal Shard Facet Gradients -->
    <linearGradient id="facetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="facetTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="facetCenterLeft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="facetCenterRight" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="facetBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="facetBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Shard Glow Filter -->
    <filter id="shardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="2" />

  <!-- Geometric Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 64 H1200 M0 128 H1200 M0 192 H1200 M0 256 H1200" />
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320" />
  </g>

  <!-- Circular Radar Rings around Shard Emblem -->
  <g stroke="#312e81" stroke-width="1.5" opacity="0.25">
    <circle cx="150" cy="160" r="110" fill="none" />
    <circle cx="150" cy="160" r="75" fill="none" />
    <line x1="150" y1="30" x2="150" y2="290" />
    <line x1="20" y1="160" x2="280" y2="160" />
  </g>

  <!-- Centered Crystal Shard Emblem -->
  <g transform="translate(150, 160) scale(0.85)" filter="url(#shardGlow)">
    <!-- Facet 1: Top Left -->
    <polygon points="0,-135 -95,-35 0,0" fill="url(#facetTopLeft)" opacity="0.95" />

    <!-- Facet 2: Top Right -->
    <polygon points="0,-135 95,-35 0,0" fill="url(#facetTopRight)" opacity="0.90" />

    <!-- Facet 3: Mid-Left Shard -->
    <polygon points="-95,-35 -75,60 0,0" fill="url(#facetCenterLeft)" opacity="0.98" />

    <!-- Facet 4: Mid-Right Shard -->
    <polygon points="95,-35 75,60 0,0" fill="url(#facetCenterRight)" opacity="0.92" />

    <!-- Facet 5: Bottom Left Apex Shard -->
    <polygon points="-75,60 0,135 0,0" fill="url(#facetBottomLeft)" opacity="0.90" />

    <!-- Facet 6: Bottom Right Apex Shard -->
    <polygon points="75,60 0,135 0,0" fill="url(#facetBottomRight)" opacity="0.95" />

    <!-- Edge Highlights -->
    <g stroke="#f0f9ff" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-135" x2="0" y2="135" />
      <line x1="-95" y1="-35" x2="95" y2="-35" />
      <line x1="-95" y1="-35" x2="0" y2="0" />
      <line x1="95" y1="-35" x2="0" y2="0" />
      <line x1="-75" y1="60" x2="0" y2="0" />
      <line x1="75" y1="60" x2="0" y2="0" />
    </g>

    <!-- Outer Polygon Rim -->
    <polygon points="0,-135 95,-35 75,60 0,135 -75,60 -95,-35" fill="none" stroke="#a5b4fc" stroke-width="3" opacity="0.95" />

    <!-- Embedded Telegram Vector -->
    <g transform="translate(-4, -4) scale(1.6)">
      <path d="M-18,-8 L22,-18 L-6,18 L-6,4 Z" fill="url(#planeGrad)" opacity="0.95" />
      <path d="M-6,4 L6,-2 L-6,18 Z" fill="#93c5fd" opacity="0.90" />
    </g>
  </g>

  <!-- Typography and Badges -->
  <g transform="translate(300, 105)">
    <!-- Project Title -->
    <text x="0" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="2" fill="url(#textGrad)">
      grm
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="url(#accent)" letter-spacing="0.01em">
      Fast Native Telegram CLI Client Powered by TDLib &amp; C++23
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 115)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="57.5" y="17" fill="#38bdf8" text-anchor="middle">C++23 Native</text>

      <rect x="127" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="182" y="17" fill="#818cf8" text-anchor="middle">TDLib 1.8+</text>

      <rect x="249" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="314" y="17" fill="#a78bfa" text-anchor="middle">Podman Quadlet</text>

      <rect x="391" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="456" y="17" fill="#34d399" text-anchor="middle">GPLv3 / GFDL</text>
    </g>
  </g>
</svg>
