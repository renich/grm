# .gitlab-ci.yml for grm (Group & Telegram Manager CLI in C++23)

default:
  image: registry.fedoraproject.org/fedora:latest
  interruptible: true
  before_script:
    - dnf -y install tdlib-devel json-c-devel cmake ninja-build gcc-c++ clang-tools-extra rstcheck python3-docutils git

stages:
  - lint
  - build
  - test

workflow:
  name: "Pipeline: $CI_COMMIT_REF_NAME"
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .ccache/
    - build/

lint-docs:
  stage: lint
  script:
    - make doc-check

build-debug:
  stage: build
  script:
    - make build
  artifacts:
    name: "grm-debug-$CI_COMMIT_SHA"
    paths:
      - build/grm
    expire_in: 3 days

build-release:
  stage: build
  script:
    - make release
    - make man
  artifacts:
    name: "grm-release-$CI_COMMIT_SHA"
    paths:
      - build/grm
      - build/grm.1
    expire_in: 1 week

test-suite:
  stage: test
  needs: ["build-release"]
  script:
    - ctest --test-dir build --output-on-failure
