# .gitlab-ci.yml for grm (Group & Telegram Manager CLI in C++23)

default:
  image: registry.gitlab.com/renich/grm/ci-fedora:latest
  interruptible: true
  before_script: []

variables:
  PKG_CONFIG_PATH: "/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig"
  LD_LIBRARY_PATH: "/usr/local/lib:/usr/local/lib64"

workflow:
  name: "Pipeline: $CI_COMMIT_REF_NAME"
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /chore\(journal\)/i'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null'

stages:
  - prepare
  - lint
  - docs
  - build
  - test
  - deploy
  - release

build-ci-image:
  stage: prepare
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Containerfile.ci
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Containerfile.ci"
      --destination "${CI_REGISTRY_IMAGE}/ci-fedora:latest"
      --cache=true

lint-docs:
  stage: lint
  script:
    - make doc-check

docs-sphinx:
  stage: docs
  needs: []
  image: python:3.12-alpine
  cache:
    key: "python-docs-pip"
    paths:
      - .cache/pip
  before_script:
    - apk add --no-cache make bash
    - pip install --cache-dir .cache/pip -q sphinx sphinx_rtd_theme
  script:
    - make -C docs dirhtml
  artifacts:
    paths:
      - docs/build/dirhtml
    expire_in: 1 week

build-debug:
  stage: build
  script:
    - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
    - cmake --build build
  artifacts:
    name: "grm-debug-$CI_COMMIT_SHA"
    paths:
      - build/grm
    expire_in: 3 days

build-release:
  stage: build
  script:
    - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
    - strip --strip-unneeded build/grm
    - make man
  artifacts:
    name: "grm-release-$CI_COMMIT_SHA"
    paths:
      - build/
    expire_in: 1 week

test-suite:
  stage: test
  needs: ["build-release"]
  script:
    - ctest --test-dir build --output-on-failure

test-asan:
  stage: test
  needs: []
  script:
    - make asan

test-tsan:
  stage: test
  needs: []
  script:
    - make tsan

pages:
  stage: deploy
  needs: ["docs-sphinx"]
  image: alpine:latest
  before_script: []
  script:
    - mkdir -p public
    - cp -r docs/build/dirhtml/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

release-tag:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build-release", "test-suite", "test-asan", "test-tsan"]
  before_script: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      sed -n "/^\[${VERSION}\]/,/^\[[0-9]/p" CHANGELOG.rst | sed '/^\[/d; /^=/d; s/^\.\. rubric:: \(.*\)/### \1/; s/``/`/g' | sed '$d' > release_notes.md
      echo "Publishing GitLab release for tag $CI_COMMIT_TAG..."
  release:
    name: "grm Release $CI_COMMIT_TAG"
    description: 'release_notes.md'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
