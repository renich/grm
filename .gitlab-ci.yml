# .gitlab-ci.yml for grm (Group & Telegram Manager CLI in C++23)

default:
  image: registry.fedoraproject.org/fedora:latest
  interruptible: true

workflow:
  name: "Pipeline: $CI_COMMIT_REF_NAME"
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null'

stages:
  - lint
  - build
  - test
  - release

cache:
  key: "tdlib-1.8.66-${CI_RUNNER_ARCH}"
  paths:
    - .local/
    - .ccache/

lint-docs:
  stage: lint
  before_script:
    - dnf -y install rstcheck python3-docutils git make
  script:
    - make doc-check

.build-template:
  before_script:
    - dnf -y install json-c-devel cmake ninja-build gcc-c++ clang-tools-extra python3-docutils git ccache gperf openssl-devel zlib-devel make
    - mkdir -p "$CI_PROJECT_DIR/.local/lib/pkgconfig" "$CI_PROJECT_DIR/.local/include"
    - export PATH="$CI_PROJECT_DIR/.local/bin:$PATH"
    - export PKG_CONFIG_PATH="$CI_PROJECT_DIR/.local/lib/pkgconfig:$PKG_CONFIG_PATH"
    - export LD_LIBRARY_PATH="$CI_PROJECT_DIR/.local/lib:$LD_LIBRARY_PATH"
    - |
      if [ ! -f "$CI_PROJECT_DIR/.local/lib/libtdjson.so" ]; then
        echo "TDLib libtdjson.so not found in cache. Building TDLib v1.8.66..."
        git clone --depth 1 --branch v1.8.0 https://github.com/tdlib/td.git .tdlib-src
        mkdir -p .tdlib-src/build
        cd .tdlib-src/build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$CI_PROJECT_DIR/.local" -DTD_ENABLE_JNI=OFF -DTD_ENABLE_DOTNET=OFF ..
        cmake --build . --target install
        cd "$CI_PROJECT_DIR"
        rm -rf .tdlib-src
      else
        echo "Found cached TDLib in $CI_PROJECT_DIR/.local"
      fi

build-debug:
  extends: .build-template
  stage: build
  script:
    - PKG_CONFIG_PATH="$CI_PROJECT_DIR/.local/lib/pkgconfig" cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$CI_PROJECT_DIR/.local"
    - cmake --build build
  artifacts:
    name: "grm-debug-$CI_COMMIT_SHA"
    paths:
      - build/grm
    expire_in: 3 days

build-release:
  extends: .build-template
  stage: build
  script:
    - PKG_CONFIG_PATH="$CI_PROJECT_DIR/.local/lib/pkgconfig" cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$CI_PROJECT_DIR/.local"
    - cmake --build build
    - strip --strip-unneeded build/grm
    - make man
  artifacts:
    name: "grm-release-$CI_COMMIT_SHA"
    paths:
      - build/
    expire_in: 1 week

test-suite:
  extends: .build-template
  stage: test
  needs: ["build-release"]
  script:
    - PKG_CONFIG_PATH="$CI_PROJECT_DIR/.local/lib/pkgconfig" LD_LIBRARY_PATH="$CI_PROJECT_DIR/.local/lib" ctest --test-dir build --output-on-failure

release-tag:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build-release", "test-suite"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - sed -n "/^\[${VERSION}\]/,/^\[[0-9]/p" CHANGELOG.rst | sed '/^\[/d; /^=/d; s/^\.\. rubric:: \(.*\)/### \1/; s/``/`/g' | sed '$d' > release_notes.md
    - echo "Publishing GitLab release for tag $CI_COMMIT_TAG..."
  release:
    name: "grm Release $CI_COMMIT_TAG"
    description: 'release_notes.md'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
